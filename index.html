<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play modern, stylish Tic-Tac-Toe in your browser. Play against friends locally or challenge the smart AI with multiple difficulty levels.">
  <meta name="keywords" content="tic tac toe, web game, modern tic tac toe, minimax ai, two player game">
  <meta name="theme-color" content="#0d1117">
  <title>Tic Tac Toe — Modern Web Experience</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>
  <!-- Ambient background lighting effects -->
  <div class="ambient-glow glow-cyan" aria-hidden="true"></div>
  <div class="ambient-glow glow-pink" aria-hidden="true"></div>

  <!-- Confetti Canvas for wins -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <main class="game-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-badge">CLASSIC REDEFINED</span>
        <h1 class="game-title">
          <span class="text-x">TIC</span>
          <span class="text-divider">•</span>
          <span class="text-neutral">TAC</span>
          <span class="text-divider">•</span>
          <span class="text-o">TOE</span>
        </h1>
      </div>
      <div class="header-actions">
        <button id="sound-toggle-btn" class="icon-btn" aria-label="Toggle Sound" title="Toggle Sound">
          <svg id="sound-icon-on" class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="sound-icon-off" class="btn-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Game Settings / Mode Bar -->
    <section class="game-controls-panel" aria-label="Game Mode Controls">
      <div class="mode-selector" role="radiogroup" aria-label="Opponent Mode">
        <button id="mode-pvp-btn" class="mode-pill active" role="radio" aria-checked="true" data-mode="pvp">
          <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>2 Players</span>
        </button>
        <button id="mode-pve-btn" class="mode-pill" role="radio" aria-checked="false" data-mode="pve">
          <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8" y2="16"></line>
            <line x1="16" y1="16" x2="16" y2="16"></line>
          </svg>
          <span>vs Computer</span>
        </button>
      </div>

      <!-- Difficulty Selector (visible when vs Computer is active) -->
      <div id="ai-difficulty-wrapper" class="difficulty-wrapper hidden">
        <span class="difficulty-label">AI Level:</span>
        <div class="difficulty-pills" role="radiogroup" aria-label="Computer Difficulty">
          <button class="diff-btn" data-diff="easy">Easy</button>
          <button class="diff-btn active" data-diff="medium">Smart</button>
          <button class="diff-btn" data-diff="hard">Unbeatable</button>
        </div>
      </div>
    </section>

    <!-- Scoreboard -->
    <section class="scoreboard" aria-label="Match Scores">
      <div class="score-card card-x" id="score-card-x">
        <div class="score-badge">PLAYER X</div>
        <div class="score-value" id="score-x">0</div>
        <div class="score-subtext" id="label-x">Player 1</div>
      </div>

      <div class="score-card card-ties" id="score-card-ties">
        <div class="score-badge">TIES</div>
        <div class="score-value" id="score-ties">0</div>
        <div class="score-subtext">Draws</div>
      </div>

      <div class="score-card card-o" id="score-card-o">
        <div class="score-badge">PLAYER O</div>
        <div class="score-value" id="score-o">0</div>
        <div class="score-subtext" id="label-o">Player 2</div>
      </div>
    </section>

    <!-- Status & Turn Indicator -->
    <div class="status-bar" id="status-bar" role="status" aria-live="polite">
      <div class="turn-indicator turn-x" id="turn-indicator">
        <span class="turn-symbol" id="turn-symbol">✕</span>
        <span class="turn-text" id="turn-text">Player X's Turn</span>
      </div>
    </div>

    <!-- The 3x3 Game Board -->
    <section class="board-wrapper">
      <div class="board" id="board" role="grid" aria-label="Tic Tac Toe Board">
        <button class="cell" id="cell-0" data-cell="0" role="gridcell" aria-label="Cell top-left"></button>
        <button class="cell" id="cell-1" data-cell="1" role="gridcell" aria-label="Cell top-center"></button>
        <button class="cell" id="cell-2" data-cell="2" role="gridcell" aria-label="Cell top-right"></button>
        <button class="cell" id="cell-3" data-cell="3" role="gridcell" aria-label="Cell middle-left"></button>
        <button class="cell" id="cell-4" data-cell="4" role="gridcell" aria-label="Cell middle-center"></button>
        <button class="cell" id="cell-5" data-cell="5" role="gridcell" aria-label="Cell middle-right"></button>
        <button class="cell" id="cell-6" data-cell="6" role="gridcell" aria-label="Cell bottom-left"></button>
        <button class="cell" id="cell-7" data-cell="7" role="gridcell" aria-label="Cell bottom-center"></button>
        <button class="cell" id="cell-8" data-cell="8" role="gridcell" aria-label="Cell bottom-right"></button>

        <!-- Dynamic Winning Strike Line -->
        <div class="strike-line hidden" id="strike-line" aria-hidden="true"></div>
      </div>
    </section>

    <!-- Action Buttons -->
    <footer class="game-footer">
      <button id="restart-round-btn" class="action-btn primary-btn" title="Start a new round">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"></path>
        </svg>
        <span>Reset Round</span>
      </button>
      <button id="reset-scores-btn" class="action-btn secondary-btn" title="Clear all scoreboard records">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        <span>Clear Scores</span>
      </button>
    </footer>
  </main>

  <!-- Game Over Modal / Winner Announcement -->
  <div class="modal-backdrop hidden" id="winner-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-glow" aria-hidden="true"></div>
      <div class="modal-icon-container" id="modal-icon-container">
        <!-- Injected dynamically: Win symbol or tie icon -->
      </div>
      <h2 class="modal-title" id="modal-title">PLAYER X WINS!</h2>
      <p class="modal-subtitle" id="modal-subtitle">Brilliant match! Ready for another round?</p>
      <div class="modal-actions">
        <button id="modal-play-again-btn" class="modal-btn play-again-btn">
          Play Again
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
